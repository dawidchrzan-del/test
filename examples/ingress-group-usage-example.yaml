# -------------------------------------------------------------------------------------
# WPROWADZENIE
#
# Ta infrastruktura jest skonfigurowana do automatycznego zarządzania certyfikatami SSL
# i Application Load Balancerem (ALB).
#
# Stworzyliśmy "bazowy Ingress", który już:
#   1. Utworzył współdzielony, publiczny ALB.
#   2. Przypisał do niego certyfikat SSL dla domeny.
#   3. Skonfigurował przekierowanie z HTTP na HTTPS.
#
# Waszym zadaniem jako deweloperów jest jedynie dodanie reguł do już istniejącego ALB.
# Robi się to poprzez stworzenie własnych zasobów Ingress i użycie tej samej nazwy
# grupy: "my-apps-group".
#
# Nie musicie martwić się o ARN certyfikatu ani o konfigurację listenerów.
# -------------------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Przykład 1: Ingress dla "order-service"
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-order-service
  namespace: default
  annotations:
    # Określa, że ten Ingress ma być obsługiwany przez AWS ALB Controller.
    kubernetes.io/ingress.class: alb

    # --- NAJWAŻNIEJSZA ADNOTACJA ---
    # Używamy tej samej nazwy grupy, co w "bazowym Ingressie" stworzonym przez Terraform.
    # Dzięki temu, ten Ingress doda jedynie regułę do istniejącego ALB, zamiast tworzyć nowy.
    alb.ingress.kubernetes.io/group.name: my-apps-group

    # Opcjonalnie: Możesz zdefiniować kolejność reguł w grupie.
    alb.ingress.kubernetes.io/group.order: '10'

spec:
  rules:
    - http:
        paths:
          # Ruch na ścieżkę /orders zostanie przekierowany do 'order-service'.
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
---
# -----------------------------------------------------------------------------
# Przykład 2: Ingress dla "payment-service"
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-payment-service
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: my-apps-group
    alb.ingress.kubernetes.io/group.order: '20'

spec:
  rules:
    - http:
        paths:
          # Ruch na ścieżkę /payments zostanie przekierowany do 'payment-service'.
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8080
